name: PR policy

on:
  pull_request:
    # edited re-runs every job when the title or the base branch changes. no job is ever skipped on
    # edited: a skipped check run counts as a success for required checks
    types: [opened, edited, synchronize, reopened]
    branches: [dev, main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  base-branch:
    name: base-branch
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # plain node script: no pnpm, no install
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Check the base branch
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
        run: node tools/ci/check-base-branch.mjs

  # squash merges use the title as the commit message, and release-please reads it
  pr-title:
    name: pr-title
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up
        uses: ./.github/actions/setup
      # linted as it lands on dev: github appends " (#<number>)" to the squash commit title
      - name: Lint the pull request title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: printf '%s (#%s)\n' "$PR_TITLE" "$PR_NUMBER" | pnpm exec commitlint --verbose

  # every commit of the pull request, so commits made without the commit-msg hook are still caught
  commits:
    name: commits
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up
        uses: ./.github/actions/setup
      # no --strict, same as the commit-msg hook
      - name: Lint the commit messages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # fail closed: an empty sha would lint the wrong range
          : "${BASE_SHA:?missing base sha}" "${HEAD_SHA:?missing head sha}"
          pnpm exec commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose
