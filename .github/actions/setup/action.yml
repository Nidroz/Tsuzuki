name: Setup
description: Set up Node.js from .nvmrc and pnpm from packageManager, then install the dependencies.

inputs:
  install:
    description: "'true' installs the dependencies with the frozen lockfile and caches the pnpm store; 'false' only sets up the tools."
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    # node first: pnpm 11 needs node >= 22 on PATH (pnpm/action-setup falls back to @pnpm/exe below
    # 22.13) and the runner's default node may be older. the pnpm store cache is therefore handled by
    # pnpm/action-setup (it runs "pnpm store path" once pnpm is installed), not by setup-node's
    # "cache: pnpm", which needs pnpm on PATH before setup-node runs. the cache is enabled only when
    # installing: a job that does not install would save an empty store under the lockfile key and
    # poison the cache for every later run
    - name: Set up Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: .nvmrc
        package-manager-cache: false

    # the version comes from the packageManager field of package.json
    - name: Set up pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        cache: ${{ inputs.install }}

    - name: Install dependencies
      if: inputs.install == 'true'
      shell: bash
      env:
        # CI never needs the git hooks
        HUSKY: '0'
      run: pnpm install --frozen-lockfile
