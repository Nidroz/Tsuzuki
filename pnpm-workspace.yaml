# pin these 5 versions to align with expo sdk 57 (expo/bundledNativeModules.json): pnpm otherwise
# auto-installs peers pulled in by expo-router's dependencies at newer, unsupported versions
overrides:
  react-dom: 19.2.3
  react-native-gesture-handler: ~2.32.0
  react-native-reanimated: 4.5.1
  react-native-worklets: 0.10.1
  '@react-native/metro-config': 0.86.3
  # eas-cli (dev tooling, run by the developer only, never in the app bundle) pins versions with
  # high advisories (pnpm audit) although patched releases exist in the same major: they are
  # forced below. re-check at M-01; remove once eas-cli ships the fix
  # GHSA-28wg-ghj8-5hjv, GHSA-2v37-7h3g-55p8, GHSA-xwg4-73v4-xw9w: eas-cli pins nanoid 3.3.8
  'eas-cli>nanoid': 3.3.20
  # GHSA-r292-9mhp-454m: eas-cli pins tar 7.5.19
  'eas-cli>tar': 7.5.22
  # GHSA-6h2x-m376-mqjq (eas-cli and @expo/eas-json pin joi 17.11.0) and GHSA-4528-x5fx-h6hg
  # (joi 17 below 17.13.9, also via @expo/eas-build-job and @expo/steps): every joi 17 is forced to
  # the patched release
  'joi@>=17.0.0 <17.13.9': 17.13.9
  # GHSA-3ppc-4f35-3m26, GHSA-7r86-cg39-jmmj, GHSA-23c5-xmqv-rm74: minimatch 5 below 5.1.8 via eas-cli and
  # filelist (jake, through @oclif/core)
  'eas-cli>minimatch': 5.1.9
  'filelist>minimatch': 5.1.9
  # GHSA-mrhx-c7xc-m3w5: any zod 4 below 4.6.6, wherever it comes from, is forced to a patched
  # release, so the ignore of this advisory (auditConfig below, for zod 3) never hides a zod 4
  'zod@>=4.0.0 <4.6.6': ^4.6.7
  # GHSA-86w9-cpqp-85rv, GHSA-7wch-p9px-956x, GHSA-jc66-7q78-782g, GHSA-8hrf-8g6f-7xwp,
  # GHSA-hqq3-7jhf-c5jx, GHSA-5x38-2vff-x55p: node-forge 1.4.0 and below, via @expo/cli,
  # @expo/code-signing-certificates, @expo/pkcs12, jks-js and eas-cli (all ^1.x): forced to 1.4.1
  'node-forge@<1.4.1': 1.4.1

allowBuilds:
  # denied: the sentry-cli binary comes from optional platform packages, the postinstall is only a
  # fallback download
  '@sentry/cli': false
  # denied: optional dtrace probes of bunyan (logger of eas-cli), unused; the build only compiles them
  dtrace-provider: false
  # denied: postinstall only copies the browser service worker; tests use msw/node
  msw: false
  # denied: postinstall only warns about mismatched dependency versions (via eas-cli)
  protobufjs: false
  # denied: the native binary comes from optional platform packages, the postinstall is only a fallback
  unrs-resolver: false

# high advisories without a patched version, in dev tooling only (never in the app bundle).
# re-check at each dependency-update chore (M-01); remove once a patch exists
auditConfig:
  ignoreGhsas:
    # braces, via metro > metro-file-map > micromatch: used only by the metro bundler at build time,
    # on glob patterns from the repository's own config, never on user input; not in the app bundle
    - GHSA-vfj7-8cjw-p6xm
    # zod 3, via expo > @expo/cli only (^3.25.76, no patched 3.x release): used only by the expo cli
    # on the developer machine and in ci, on the repository's own inputs; not in the app bundle. zod 4
    # is patched (the app's own zod and the override above). remove once @expo/cli moves to zod 4
    - GHSA-mrhx-c7xc-m3w5

# the sentry gradle step runs node_modules/@sentry/cli/bin/sentry-cli from the project root; with
# pnpm, @sentry/cli is only a dependency of @sentry/react-native, so it is hoisted to the root
publicHoistPattern:
  - '@sentry/cli'
