# smoke flow: the app launches on Discover, and each of the five tabs opens its screen.
# runs in the development build (development variant, app id io.github.nidroz.tsuzuki.dev,
# ADR-0012), opened on the project with the dev-client deep link
# tsuzuki://expo-development-client/?url=<url-encoded metro url>;
# disableOnboarding=1 skips the dev menu onboarding popup that would cover the screen.
# metro on this machine by default, reached from the device after adb reverse tcp:8081 tcp:8081;
# a phone on the LAN overrides it:
# maestro test -e METRO_URL=http://<lan-ip>:8081 e2e/flows
appId: io.github.nidroz.tsuzuki.dev
---
- launchApp:
    clearState: true
- openLink: tsuzuki://expo-development-client/?url=${encodeURIComponent(METRO_URL || 'http://127.0.0.1:8081')}&disableOnboarding=1
# the first bundle can take a while
- extendedWaitUntil:
    visible:
      id: discover-screen
    timeout: 60000
# the tab bar, in order, then back to Discover
- assertVisible:
    id: tab-search
- tapOn:
    id: tab-search
- assertVisible:
    id: search-screen
- assertVisible:
    id: tab-library
- tapOn:
    id: tab-library
- assertVisible:
    id: library-screen
- assertVisible:
    id: tab-favorites
- tapOn:
    id: tab-favorites
- assertVisible:
    id: favorites-screen
- assertVisible:
    id: tab-settings
- tapOn:
    id: tab-settings
- assertVisible:
    id: settings-screen
- assertVisible:
    id: tab-discover
- tapOn:
    id: tab-discover
- assertVisible:
    id: discover-screen
