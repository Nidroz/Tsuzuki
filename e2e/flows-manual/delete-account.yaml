# account deletion flow (A-06, FR-24, ADR-0018), manual only: it deletes the account it signs in
# with. never the shared test account: it reads MAESTRO_E2E_THROWAWAY_EMAIL and _PASSWORD, a
# throwaway staging account the owner creates for the run (e2e/README.md). sign in, open the
# account deletion from the settings, delete after the confirmation, see the deleted state, then
# try to sign in again with the same credentials: refused, the sign in error shows. runs in the
# development build like the smoke flow, with clearState. elements are found by id only, so the
# flow does not depend on the device language
appId: io.github.nidroz.tsuzuki.dev
---
- runFlow:
    file: ../subflows/launch-signed-out.yaml
- runFlow:
    file: ../subflows/sign-in.yaml
    env:
      EMAIL: ${MAESTRO_E2E_THROWAWAY_EMAIL}
      PASSWORD: ${MAESTRO_E2E_THROWAWAY_PASSWORD}
- scrollUntilVisible:
    element:
      id: settings-account-delete-account
    direction: DOWN
- tapOn:
    id: settings-account-delete-account
- extendedWaitUntil:
    visible:
      id: delete-account-form
    timeout: 10000
- scrollUntilVisible:
    element:
      id: delete-account-delete
    direction: DOWN
# two deliberate taps: the button opens the confirmation, which deletes
- tapOn:
    id: delete-account-delete
- tapOn:
    id: delete-account-confirm-confirm
# the request waits at most 20 s for the answer
- extendedWaitUntil:
    visible:
      id: delete-account-deleted
    timeout: 30000
- tapOn:
    id: delete-account-back
- extendedWaitUntil:
    visible:
      id: settings-account-sign-in
    timeout: 10000
# the same credentials are refused: the account is gone
- runFlow:
    file: ../subflows/submit-sign-in.yaml
    env:
      EMAIL: ${MAESTRO_E2E_THROWAWAY_EMAIL}
      PASSWORD: ${MAESTRO_E2E_THROWAWAY_PASSWORD}
- extendedWaitUntil:
    visible:
      id: auth-sign-in-error
    timeout: 30000
- assertVisible:
    id: auth-sign-in-screen
